
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FluentHindi: Master English</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes drift {
          0% { transform: translate(0, 0); }
          50% { transform: translate(10%, 10%); }
          100% { transform: translate(0, 0); }
        }
        .animate-drift { animation: drift 20s ease-in-out infinite; }
        
        @keyframes waveform {
          0%, 100% { height: 8px; }
          50% { height: 28px; }
        }
        .animate-waveform { animation: waveform 0.5s ease-in-out infinite; }

        @keyframes pulse-border {
          0% { box-shadow: inset 0 0 0 0px rgba(16, 185, 129, 0); }
          50% { box-shadow: inset 0 0 60px 10px rgba(16, 185, 129, 0.3); }
          100% { box-shadow: inset 0 0 0 0px rgba(16, 185, 129, 0); }
        }
        .animate-pulse-border { animation: pulse-border 2s infinite ease-in-out; }

        .glass {
          background: rgba(255, 255, 255, 0.03);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .ai-glass {
          background: linear-gradient(135deg, rgba(79, 70, 229, 0.1), rgba(79, 70, 229, 0.05));
          backdrop-filter: blur(10px);
          border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .user-glass {
          background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(16, 185, 129, 0.05));
          backdrop-filter: blur(10px);
          border: 1px solid rgba(16, 185, 129, 0.2);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",

  }
}

</head>

</html>
